<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>付款處理 - 摃菇 iOS 模擬器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { 
            max-width: 500px; 
            width: 100%;
            background: white; 
            border-radius: 20px; 
            padding: 40px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
        }
        h1 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 30px; 
        }
        .order-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .order-info p {
            margin: 10px 0;
            color: #666;
        }
        .order-info strong {
            color: #333;
        }
        .payment-btn {
            width: 100%;
            padding: 15px;
            background: #34C759;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .payment-btn:hover {
            background: #30B050;
        }
        .warning {
            background: #FFF3CD;
            border: 1px solid #FFC107;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>付款處理</h1>
        
        <div class="warning">
            ⚠️ <strong>測試模式</strong><br>
            這是模擬付款頁面。實際部署時，這裡會跳轉到綠界金流付款頁面。
        </div>
        
        <div class="order-info" id="orderInfo">
            <p><strong>訂單編號：</strong><span id="orderId">載入中...</span></p>
            <p><strong>方案：</strong><span id="planType">載入中...</span></p>
            <p><strong>金額：</strong><span id="amount">載入中...</span></p>
        </div>
        
        <button class="payment-btn" id="confirmBtn" onclick="confirmPayment()">確認付款（測試）</button>
        
        <div class="loading" id="loading">
            <p>正在處理付款...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        
        if (!orderId) {
            document.getElementById('orderInfo').innerHTML = '<p style="color: red;">訂單不存在</p>';
            document.getElementById('confirmBtn').disabled = true;
        } else {
            document.getElementById('orderId').textContent = orderId;
            
            // 從 URL 或 API 獲取訂單信息
            fetch(`/api/payment/order/${orderId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const planNames = {
                            annual: '年費方案',
                            lifetime: '永久方案'
                        };
                        document.getElementById('planType').textContent = planNames[data.order.planType] || data.order.planType;
                        document.getElementById('amount').textContent = 'NT$ ' + data.order.amount;
                    }
                })
                .catch(err => {
                    console.error('獲取訂單信息失敗:', err);
                });
        }
        
        async function confirmPayment() {
            if (!orderId) {
                alert('訂單不存在');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('confirmBtn').disabled = true;
            
            try {
                const response = await fetch('/api/payment/confirm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        orderId: orderId
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.licenseKey) {
                    // 付款成功，跳轉到成功頁面
                    window.location.href = `/payment/success?licenseKey=${data.licenseKey}&orderId=${orderId}`;
                } else {
                    alert('付款處理失敗：' + (data.error || '未知錯誤'));
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('confirmBtn').disabled = false;
                }
            } catch (error) {
                alert('網絡錯誤，請稍後再試');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('confirmBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
