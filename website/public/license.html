<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授權與下載 - 摃菇 / KongGoo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; background:#0b1020; color:#fff; margin:0; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 32px 18px; }
    .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 18px; margin: 14px 0; }
    a { color:#a7c7ff; }
    input, button { font-size:16px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); }
    input { width: min(520px, 100%); background: rgba(0,0,0,0.25); color:#fff; }
    button { cursor:pointer; background:#5b7cff; color:#fff; border: 0; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .muted { opacity: .85; }
    .ok { color:#5CFFB2; }
    .bad { color:#ff9aa2; }
    .links a { display:inline-block; margin-right: 12px; }
    code { background: rgba(0,0,0,0.35); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>授權與下載</h1>
    <p class="muted">如果你已經購買並拿到授權碼，可以在這裡檢查授權碼是否有效，並取得下載連結。</p>

    <div class="card">
      <h2>1) 檢查授權碼</h2>
      <div class="row">
        <input id="licenseKey" placeholder="例如：PKM-XXXXXXXXXXXXXXXX" autocomplete="off" />
        <button onclick="verify()">檢查</button>
      </div>
      <p id="result" class="muted" style="margin-top:10px;"></p>
      <div id="downloadLinks" class="links" style="margin-top:10px; display:none;">
        <a id="macLink" href="#" target="_blank">下載 macOS 版本</a>
        <a id="winLink" href="#" target="_blank">下載 Windows 版本</a>
      </div>
    </div>

    <div class="card">
      <h2>2) App 內如何激活</h2>
      <ol class="muted">
        <li>打開 App → 進入「授權」頁面</li>
        <li>輸入授權碼 → 點「激活授權碼」</li>
        <li>激活成功後，即可永久使用（或依方案）</li>
      </ol>
      <p class="muted">注意：激活是綁定設備的（防止授權被濫用）。</p>
    </div>

    <div class="card">
      <h2>3) 付款後在哪裡拿到授權碼？</h2>
      <p class="muted">付款成功後會在成功頁面顯示授權碼：<a href="/payment/success">/payment/success</a>（系統會帶參數顯示你的授權碼）。</p>
    </div>
  </div>

  <script>
    async function verify() {
      const licenseKey = document.getElementById('licenseKey').value.trim();
      const result = document.getElementById('result');
      const dl = document.getElementById('downloadLinks');
      dl.style.display = 'none';
      result.textContent = '檢查中...';

      if (!licenseKey) {
        result.innerHTML = '<span class="bad">請輸入授權碼</span>';
        return;
      }

      try {
        const res = await fetch('/api/license/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ licenseKey })
        });
        const data = await res.json().catch(() => ({}));

        if (res.status === 503 && data.code === 'KV_UNAVAILABLE') {
          result.innerHTML = '<span class="bad">授權系統暫時不可用（稍後再試）</span>';
          return;
        }

        if (!data || !data.valid) {
          result.innerHTML = '<span class="bad">授權碼無效，請確認後再試</span>';
          return;
        }

        result.innerHTML = `<span class="ok">授權碼有效</span>（方案：<code>${data.planType || 'unknown'}</code>）`;
        document.getElementById('macLink').href = data.download?.mac || 'https://github.com/awe7893625/pikmin-architect/releases/download/v20260206-v2/ios-location-simulator-mac.dmg';
        document.getElementById('winLink').href = data.download?.windows || '/downloads/ios-location-simulator-windows.exe';
        dl.style.display = 'block';
      } catch (e) {
        result.innerHTML = '<span class="bad">檢查失敗，請稍後再試</span>';
      }
    }
  </script>
</body>
</html>
