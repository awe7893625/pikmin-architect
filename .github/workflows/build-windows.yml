name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build pymobiledevice3.exe with PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymobiledevice3 pyinstaller
          mkdir -p "Windows版本/bin"
          python -c "
          with open('_entry.py', 'w') as f:
              f.write('from pymobiledevice3.__main__ import cli\ncli()\n')
          "
          cat _entry.py
          pyinstaller --onefile --name=pymobiledevice3 \
            --distpath="Windows版本/bin" \
            --collect-all=pymobiledevice3 \
            --hidden-import=pymobiledevice3.cli \
            --hidden-import=pymobiledevice3.lockdown \
            --hidden-import=pymobiledevice3.services \
            --hidden-import=pymobiledevice3.services.simulate_location \
            _entry.py

      - name: Verify pymobiledevice3.exe exists
        shell: bash
        run: |
          ls -lh "Windows版本/bin/pymobiledevice3.exe"
          if [ ! -f "Windows版本/bin/pymobiledevice3.exe" ]; then
            echo "ERROR: pymobiledevice3.exe not found!"
            exit 1
          fi
          echo "pymobiledevice3.exe found, size OK"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build Electron app
        shell: bash
        run: |
          cd "Windows版本"
          npm install
          npm run build:win

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: konggoo-windows-installer
          path: Windows版本/dist/Pikmin Architect Setup 1.0.0.exe

      - name: Upload to Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v20260215-reveal "Windows版本/dist/Pikmin Architect Setup 1.0.0.exe" --clobber --repo ${{ github.repository }} || echo "Upload attempted"
