name: Claude Code Security Review

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  security-review:
    name: Security review
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Run Claude Code Security Review
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-sonnet-5
          claudecode-timeout: 20
          comment-pr: true
          upload-results: true
          exclude-directories: node_modules,build,build_direct,dist
          false-positive-filtering-instructions: .github/security-review/false-positives.md
          custom-security-scan-instructions: .github/security-review/scan-instructions.md
